########################################
# Environment detection patterns.
########################################

## Feature environment.
.feature_detect_template:
  variables:
    DRUSH_ALIAS_TYPE: $CI_COMMIT_REF_SLUG
    DF_ENV_TYPE: feature
  environment:
    name: feature/$CI_COMMIT_REF_NAME
    action: prepare
    deployment_tier: other

## Feature environment exclude rules.
.feature_detect_exclude_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: never

## Feature environment "no env" rules.
#
# This should be used for any job that _requires_ a festure environment to exist.
.feature_detect_no_env_exclude_rules:
  rules:
    - if: '$DF_NO_FEATURE_ENV == "true"'
      when: never

## Feature environment include rules.
.feature_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

## Dev environment.
.dev_detect_template:
  variables:
    DRUSH_ALIAS_TYPE: dev
    DF_ENV_TYPE: dev
  environment:
    name: dev
    action: prepare
    deployment_tier: development

## Dev environment exclude rules.
.dev_detect_exclude_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

## Dev environment include rules.
.dev_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

## QA environment.
.qa_detect_template:
  variables:
    DRUSH_ALIAS_TYPE: qa
    DF_ENV_TYPE: qa
  environment:
    name: qa
    action: prepare
    deployment_tier: testing

## QA environment "no env" rules.
#
# This should be used for any job that _requires_ a QA environment to exist.
.qa_detect_no_env_exclude_rules:
  rules:
    - if: '$DF_NO_QA_ENV == "true"'
      when: never

## QA environment include rules.
.qa_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+-.+$/'

## Prod environment.
.prod_detect_template:
  variables:
    DRUSH_ALIAS_TYPE: prod
    DF_ENV_TYPE: prod
  environment:
    name: prod
    action: prepare
    deployment_tier: production

## Prod environment include rules.
.prod_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'

## Non-release environment exclude rules.
.non_release_detect_exclude_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never

## Non-release environment include rules.
.non_release_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH'

## Release environment exclude rules.
.release_detect_exclude_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: never

## Release environment include rules.
.release_detect_include_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(-.*)?$/'
