########################################
# Update Pantheon SolrCloud/Search API Solr.
########################################

# Basic Pantheon search api index update template.
.update_pantheon_search_api_template:
  stage: pre_validate
  allow_failure: true
  script:
    ## Install terminus to communicate with the Pantheon servers.
    - mkdir ~/terminus
    - cd ~/terminus
    - curl -O https://raw.githubusercontent.com/pantheon-systems/terminus-installer/master/builds/installer.phar && php installer.phar install
    - vendor/bin/terminus auth:login --machine-token=$MACHINE_TOKEN
    - vendor/bin/terminus drush $DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE -- search-api-reindex
    - vendor/bin/terminus drush $DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE -- search-api-index

## Basic Pantheon search api exclude rules.
.update_pantheon_search_api_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$TARGET_PLATFORM != "pantheon"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never

## Update Pantheon Solr Cloud collections and Search API template.
.update_pantheon_solrcloud_template:
  stage: pre_validate
  allow_failure: true
  variables:
    SEARCH_API_SOLR_ID: default_solr_server
    SEARCH_API_SOLR_API_VERSION: '7'
    SEARCH_API_SOLR_CONFIGSET: drupal
    SOLR_NUM_SHARDS: 1
  script:
    echo "Placeholder for Pantheon solrcloud update script."

## Pantheon Solr Cloud exclude rules.
.update_pantheon_solrcloud_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$TARGET_PLATFORM != "pantheon"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never

########################################
# Jobs.
########################################

## Dev update.
update_pantheon_search_dev:
  extends:
    - .update_pantheon_solrcloud_template
    - .dev_detect_template
  variables:
    DRUSH_ALIAS_TYPE: dev
  rules:
    - if: '$SKIP_JOBS =~ /update_pantheon_search_dev/'
      when: never
    - !reference [.update_pantheon_search_api_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA update.
update_pantheon_search_qa:
  extends:
    - .update_pantheon_solrcloud_template
    - .qa_detect_template
  variables:
    DRUSH_ALIAS_TYPE: test
  rules:
    - if: '$SKIP_JOBS =~ /update_pantheon_search_qa/'
      when: never
    - !reference [.update_pantheon_search_api_exclude_rules, rules]
    - !reference [.qa_detect_no_env_exclude_rules, rules]
    - !reference [.qa_detect_include_rules, rules]

## Prod update.
update_pantheon_search_prod:
  extends:
    - .update_pantheon_solrcloud_template
    - .prod_detect_template
  variables:
    DRUSH_ALIAS_TYPE: live
  allow_failure: false
  rules:
