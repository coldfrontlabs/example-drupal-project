########################################
# Update SolrCloud/Search API Solr.
########################################


########################################
# Templates.
########################################

## Basic search api index update template.
.update_search_api_template:
  stage: pre_validate
  allow_failure: true
  environment:
    action: access
  script:
    # Flag everything for reindexing.
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:reset-tracker
    # Run the index.
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:index

## Basic search api exclude rules.
.update_search_api_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$TARGET_PLATFORM == "pantheon"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never

## Update Solr Cloud collections and Search API template.
.update_solrcloud_template:
  stage: pre_validate
  allow_failure: true
  variables:
    SEARCH_API_SOLR_ID: default_solr_server
    SEARCH_API_SOLR_API_VERSION: '7'
    SEARCH_API_SOLR_CONFIGSET: drupal
    SOLR_NUM_SHARDS: 1
  script:
    - export DF_SOLR_ADMIN_INSTALLED=$(drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE pm:list --pipe --type=module --status=enabled --no-core --filter=search_api_solr_admin --format=json 2>/dev/null)
    - >
      if [ ! -z "$DF_SOLR_ADMIN_INSTALLED" ]; then
        echo "Search API Solr Admin found. Updating..."
        # Update any missing field types.
        echo "Updating missing field types..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-solr:install-missing-fieldtypes
        # Upload the config set.
        echo "Uploading config set..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-solr:upload-configset $SEARCH_API_SOLR_ID --numShards=$SOLR_NUM_SHARDS
        # Flag everything for reindexing.
        echo "Flagging everything to reindexing..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:reset-tracker
        # Run the index.
        echo "Indexing..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:index
        # Clear the cache.
        echo "Clearing the cache..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE cr
        echo "Update complete!"
      else
        echo "Search API Solr Admin not found."
        echo "Please run 'drush en search_api_solr_admin' to use updating indexing process."
        echo "Using old method. Updating..."
        # Update any missing field types.
        echo "Updating missing field types..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-solr:install-missing-fieldtypes
        # Get config.
        echo "Getting config..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-solr:get-server-config $SEARCH_API_SOLR_ID $DRUSH_ARB_BACKUP_DIR/solrconf.zip
        # Load info about solr server.
        echo "Loading Solr information..."
        export SEARCH_API_SOLR_SERVER=$(drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE config:get search_api.server.$SEARCH_API_SOLR_ID backend_config.connector_config.host --include-overridden --format=string)
        export SOLR_ADMIN=$(drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE config:get search_api.server.$SEARCH_API_SOLR_ID backend_config.connector_config.username --include-overridden --format=string)
        export SOLR_ADMIN_PASSWD=$(drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE config:get search_api.server.$SEARCH_API_SOLR_ID backend_config.connector_config.password --include-overridden --format=string)
        export SOLR_SCHEME=$(drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE config:get search_api.server.$SEARCH_API_SOLR_ID backend_config.connector_config.scheme --include-overridden --format=string)
        # Can't update the config set if a collection is using it.
        # Delete the existing collection.
        echo "Deleting existing collection..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE ssh "curl $SOLR_CURL_OPTS --user $SOLR_ADMIN:$SOLR_ADMIN_PASSWD -X POST \"$SOLR_SCHEME://$SEARCH_API_SOLR_SERVER:8983/solr/admin/collections?action=DELETE&name=$SEARCH_API_SOLR_CONFIGSET\""
        # Can't upload the same config set twice so we remove that one first.
        # Delete existing config set
        echo "Deleting existing config set..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE ssh "curl $SOLR_CURL_OPTS --user $SOLR_ADMIN:$SOLR_ADMIN_PASSWD -X POST \"$SOLR_SCHEME://$SEARCH_API_SOLR_SERVER:8983/solr/admin/configs?action=DELETE&name=$SEARCH_API_SOLR_CONFIGSET\""
        # Recreate config set
        echo "Recreating config set..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE ssh "curl $SOLR_CURL_OPTS --user $SOLR_ADMIN:$SOLR_ADMIN_PASSWD -X POST --header 'Content-Type:application/octet-stream' --data-binary @- \"$SOLR_SCHEME://$SEARCH_API_SOLR_SERVER:8983/solr/admin/configs?action=UPLOAD&name=$SEARCH_API_SOLR_CONFIGSET\" < $DRUSH_ARB_BACKUP_DIR/solrconf.zip"
        # Recreate the collection
        echo "Recreating collection..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE ssh "curl $SOLR_CURL_OPTS --user $SOLR_ADMIN:$SOLR_ADMIN_PASSWD -X POST \"$SOLR_SCHEME://$SEARCH_API_SOLR_SERVER:8983/solr/admin/collections?action=CREATE&name=$SEARCH_API_SOLR_CONFIGSET&autoAddReplicas=true&numShards=$SOLR_NUM_SHARDS&collection.configName=$SEARCH_API_SOLR_CONFIGSET\""
        # 5. Reindex content
        echo "Indexing..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:clear
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:disable-all
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:enable-all
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-solr:finalize-index --force
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-reindex
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api-index
        # Clear the cache.
        echo "Clearing the cache..."
        drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE cr
        echo "Update complete!"
      fi

## Solr Cloud exclude rules.
.update_solrcloud_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$TARGET_PLATFORM == "pantheon"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never


########################################
# Jobs.
########################################

## Feature update.
update_search_feature:
  extends:
    - .update_search_api_template
    - .feature_detect_template
  environment:
    url: https://$CI_COMMIT_REF_SLUG.$DF_TLD
  rules:
    - if: '$SKIP_JOBS =~ /update_search_feature/'
      when: never
    - !reference [.update_search_api_exclude_rules, rules]
    - !reference [.feature_detect_exclude_rules, rules]
    - !reference [.feature_detect_no_env_exclude_rules, rules]
    - !reference [.feature_detect_include_rules, rules]

## Dev update.
update_search_dev:
  extends:
    - .update_search_api_template
    - .dev_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /update_search_dev/'
      when: never
    - !reference [.update_search_api_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA update.
update_search_qa:
  extends:
    - .update_search_api_template
    - .qa_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /update_search_qa/'
      when: never
    - !reference [.update_search_api_exclude_rules, rules]
    - !reference [.qa_detect_no_env_exclude_rules, rules]
    - !reference [.qa_detect_include_rules, rules]

## Prod update.
update_search_prod:
  extends:
    - .update_search_api_template
    - .prod_detect_template
  allow_failure: false
  rules:
    - if: '$SKIP_JOBS =~ /update_search_prod/'
      when: never
    - !reference [.update_search_api_exclude_rules, rules]
    - !reference [.prod_detect_include_rules, rules]


