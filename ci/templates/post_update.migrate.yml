########################################
# Update Migrations.
########################################


########################################
# Templates.
########################################

## Update migrations template.
.update_migrations_template:
  stage: post_update
  allow_failure: true
  timeout: 3h
  environment:
    action: access
  variables:
    MIGRATION_TAGS: --tag=autoimport
    MIGRATION_ARGS: --update --feedback=50
  script:
    # Disable Search API Indexing for now
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:disable-all || true
    # Print current migration status
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE migrate:status $MIGRATION_TAGS
    # Run migrations
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE migrate:import $MIGRATION_TAGS $MIGRATION_ARGS
    # Restore exported configuration / enable search indexes.
    - drush $DRUSH_SITE_ALIAS_OPTIONS --ssh-options="$DRUSH_SSH_OPTIONS" @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE search-api:enable-all || true

## Update migrations exclude rules.
.update_migrations_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$TARGET_PLATFORM == "pantheon"'
      when: never
    - if: '$TARGET_PLATFORM == "acquia"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never

########################################
# Jobs.
########################################

## Feature update.
update_migrations_feature:
  extends:
    - .update_migrations_template
    - .feature_detect_template
  environment:
    url: https://$CI_COMMIT_REF_SLUG.$DF_TLD
  when: manual
  rules:
    - if: '$SKIP_JOBS =~ /update_migrations_feature/'
      when: never
    - !reference [.update_migrations_exclude_rules, rules]
    - !reference [.feature_detect_exclude_rules, rules]
    - !reference [.feature_detect_no_env_exclude_rules, rules]
    - !reference [.feature_detect_include_rules, rules]

## Dev update.
update_migrations_dev:
  extends:
    - .update_migrations_template
    - .dev_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /update_migrations_dev/'
      when: never
    - !reference [.update_migrations_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA update.
update_migrations_qa:
  extends:
    - .update_migrations_template
    - .qa_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /update_migrations_qa/'
      when: never
    - !reference [.update_migrations_exclude_rules, rules]
    - !reference [.qa_detect_no_env_exclude_rules, rules]
    - !reference [.qa_detect_include_rules, rules]

## Prod update.
update_migrations_prod:
  extends:
    - .update_migrations_template
    - .prod_detect_template
  allow_failure: false
  rules:
    - if: '$SKIP_JOBS =~ /update_migrations_prod/'
      when: never
    - !reference [.update_migrations_exclude_rules, rules]
    - !reference [.prod_detect_include_rules, rules]
