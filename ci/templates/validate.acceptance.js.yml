########################################
# JS acceptance tests.
########################################


########################################
# Templates.
########################################

## Test JS site functionality template.
.acceptance_js_tests_template:
  stage: validate
  environment:
    action: access
  services:
    -
      name: selenium/standalone-chrome
      alias: selenium
  variables:
    DF_VALIDATE_ARGS: --no-exit
    DOCKER_SHM_SIZE: 2147483648
    START_XVFB: 'false'
    DF_SELENIUM_PORT: 4444
    DF_SELENIUM_HOST: selenium
    NPM_ARGS: ''
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-js-acceptance"
    paths:
      - testing/codeceptjs/output
    reports:
      junit: testing/codeceptjs/output/result.xml
    when: always
  script:
    # We run the acceptance test process with --no-exit so that we can set the process exit code on the runner after the tests are run.
    - echo $DF_VALIDATE_ARGS
    # SSH to the drupal server and run the codeception tests with a tunnel set up to access the selenium grid.
    - export DF_TEST_URL=`drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r .[].uri`
    # Install the test tools if they aren't already present.
    - npm i $NPM_ARGS
    # Run the acceptance suite.
    - echo DF_SELENIUM=$DF_SELENIUM_HOST >> .env.ci
    - echo DF_SHIELD_USER=$DF_SHIELD_USER >> .env.ci
    - echo DF_SHIELD_PW=$DF_SHIELD_PW >> .env.ci
    - echo DF_SELENIUM_PORT=$DF_SELENIUM_PORT >> .env.ci
    - echo DF_TEST_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r '.[].uri') >> .env.ci
    - echo DF_REF_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.prod --format=json | jq -r '.[].uri') >> .env.ci
    - npx node-env-run --exec 'npm run test:acceptance:js' --env .env.ci --force

## Acceptance tests exclude rules.
.acceptance_js_tests_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy" && $TARGET_PIPELINE != "validation"'
      when: never
    - if: '$SKIP_VALIDATE == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip validate\]/'
      when: never

########################################
# Jobs.
########################################

## Feature acceptance tests.
validate_feature_js_acceptance:
  extends:
    - .acceptance_js_tests_template
    - .feature_detect_template
  artifacts:
    expire_in: 2 days
  rules:
    - if: '$SKIP_JOBS =~ /validate_feature_js_acceptance/'
      when: never
    - !reference [.acceptance_js_tests_exclude_rules, rules]
    - !reference [.feature_detect_exclude_rules, rules]
    - !reference [.feature_detect_no_env_exclude_rules, rules]
    - !reference [.feature_detect_include_rules, rules]

## Dev acceptance tests.
validate_dev_js_acceptance:
  extends:
    - .acceptance_js_tests_template
    - .dev_detect_template
  artifacts:
    expire_in: 2 days
  rules:
    - if: '$SKIP_JOBS =~ /validate_dev_js_acceptance/'
      when: never
    - !reference [.acceptance_js_tests_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA acceptance tests.
validate_qa_js_acceptance:
  extends:
    - .acceptance_js_tests_template
    - .qa_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /validate_qa_js_acceptance/'
      when: never
    - !reference [.acceptance_js_tests_exclude_rules, rules]
    - !reference [.qa_detect_include_rules, rules]

## Prod acceptance tests.
validate_prod_js_acceptance:
  extends:
    - .acceptance_js_tests_template
    - .prod_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /validate_prod_js_acceptance/'
      when: never
    - !reference [.acceptance_js_tests_exclude_rules, rules]
    - !reference [.prod_detect_include_rules, rules]
