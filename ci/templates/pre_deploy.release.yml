########################################
# Upload release builds.
########################################

## Release upload.
#
# Will run for both QA and Production tags.
release_upload:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: pre_deploy
  before_script:
    - echo 'Preparing release artifact'
  script:
    - echo 'Creating release artifact'
  interruptible: true
  release:
    name: $CI_PROJECT_NAME-$CI_COMMIT_TAG
    tag_name: $CI_COMMIT_TAG
    ref: $CI_COMMIT_TAG
    description: CHANGELOG.md
  rules:
    - if: '$SKIP_JOBS =~ /release_upload/'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never
    - !reference [.release_detect_exclude_rules, rules]
    - !reference [.release_detect_include_rules, rules]
