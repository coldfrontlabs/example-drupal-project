########################################
# Build Drupal.
########################################


########################################
# Templates.
########################################

## Build template.
.build_drupal_template:
  stage: build
  variables:
    BUILD_COMPOSER_OPTIONS: --no-dev --optimize-autoloader
    BUILD_NPM_OPTIONS: --production --omit=dev --ignore-scripts
    COMPOSER_EXIT_ON_PATCH_FAILURE: 1
  script:
    - |
      npm install $BUILD_NPM_OPTIONS &
      composer install $BUILD_COMPOSER_OPTIONS
    - wait
    - npm run build
  interruptible: true
  needs: []
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME"
    paths:
      - ./
    exclude:
    - container/**
    - container
    - docker/**
    - docker
    - .devcontainer/**
    - .devcontainer
    - .vscode/**
    - .vscode
    - .gitlab/**
    - .gitlab
    - .git/**
    - .git*
    - .npm/**
    - .npm
    - .composer/**
    - .composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
    paths:
      - .npm
      - .composer
    when: on_success
    policy: pull-push

## Build exlude rules.
.build_drupal_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE == "validation"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[validate only\]/'
      when: never

########################################
# Jobs.
########################################

## Dev build.
#
# Will run for both Feature and Development branches.
drupal_dev_build:
  extends:
    - .build_drupal_template
  variables:
    BUILD_COMPOSER_OPTIONS: ' '
    BUILD_NPM_OPTIONS: ' '
  artifacts:
    expire_in: 1 day
  rules:
    - if: '$SKIP_JOBS =~ /drupal_dev_build/'
      when: never
    - !reference [.build_drupal_exclude_rules, rules]
    - !reference [.non_release_detect_exclude_rules, rules]
    - !reference [.non_release_detect_include_rules, rules]

## Release build.
#
# Will run for both QA and Production tags.
drupal_release_build:
  extends: .build_drupal_template
  rules:
    - if: '$SKIP_JOBS =~ /drupal_release_build/'
      when: never
    - !reference [.build_drupal_exclude_rules, rules]
    - !reference [.release_detect_exclude_rules, rules]
    - !reference [.release_detect_include_rules, rules]
