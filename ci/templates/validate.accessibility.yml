########################################
# Accessibility tests.
########################################


########################################
# Templates.
########################################

## Standard accessibility regression test template.
.accessibility_axe_template:
  stage: validate
  environment:
    action: access
  script:
    - npm i $NPM_ARGS
    # Run the acceptance suite.
    - echo DF_SELENIUM=$DF_SELENIUM_HOST >> .env.ci
    - echo DF_SELENIUM_PORT=$DF_SELENIUM_PORT >> .env.ci
    - echo DF_SHIELD_USER=$DF_SHIELD_USER >> .env.ci
    - echo DF_SHIELD_PW=$DF_SHIELD_PW >> .env.ci
    - echo DF_TEST_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r '.[].uri') >> .env.ci
    - echo DF_REF_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.prod --format=json | jq -r '.[].uri') >> .env.ci
    - npx node-env-run --exec 'npm run test:accessibility:axe' --env .env.ci --force
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-axe_report"
    expire_in: 2 days
    paths:
      - testing/axe/reports
    reports:
      junit: testing/axe/reports/xunit/*_results.xml
    when: always

## Accessibility lighthouse regression test template.
.accessibility_lighthouse_template:
  stage: validate
  script:
    - npm i $NPM_ARGS
    # Run the acceptance suite.
    - echo DF_SELENIUM=$DF_SELENIUM_HOST >> .env.ci
    - echo DF_SELENIUM_PORT=$DF_SELENIUM_PORT >> .env.ci
    - echo DF_SHIELD_USER=$DF_SHIELD_USER >> .env.ci
    - echo DF_SHIELD_PW=$DF_SHIELD_PW >> .env.ci
    - echo DF_TEST_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r '.[].uri') >> .env.ci
    - echo DF_REF_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.prod --format=json | jq -r '.[].uri') >> .env.ci
    - npx node-env-run --exec 'npm run test:accessibility:lighthouse' --env .env.ci --force
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-lighhouse_data"
    expire_in: 2 days
    paths:
      - testing/lighthouse/reports
    when: always

## Accesibility exclude rules.
.accessibility_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy" && $TARGET_PIPELINE != "validation"'
      when: never
    - if: '$SKIP_VALIDATE == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip validate\]/'
      when: never

########################################
# Jobs.
########################################

## Feature accessibility tests.
validate_feature_axe_a11y:
  extends:
    - .accessibility_axe_template
    - .feature_detect_template
  variables:
    DF_TEST_HOST: 'http://example.com'
  rules:
    - if: '$SKIP_JOBS =~ /validate_feature_axe_a11y/'
      when: never
    - !reference [.accessibility_exclude_rules, rules]
    - !reference [.feature_detect_exclude_rules, rules]
    - !reference [.feature_detect_no_env_exclude_rules, rules]
    - !reference [.feature_detect_include_rules, rules]

