########################################
# CSS regression tests.
########################################


########################################
# Templates.
########################################

## CSS reference images template.
.css_reference_template:
  stage: test
  environment:
    action: prepare
  needs: []
  services:
    -
      name: selenium/standalone-chrome
      alias: selenium
  variables:
    DF_VALIDATE_ARGS: --no-exit
    DOCKER_SHM_SIZE: 2147483648
    START_XVFB: 'false'
    DF_SELENIUM_PORT: 4444
    DF_SELENIUM_HOST: selenium
    NPM_ARGS: ''
    DF_REF_HOST: 'http://example.com'
    DF_TEST_HOST: 'http://example.com'
  script:
    - |
      npm install $BUILD_NPM_OPTIONS &
      composer install $BUILD_COMPOSER_OPTIONS
    - wait
    - echo DF_SELENIUM=$DF_SELENIUM_HOST >> .env.ci
    - echo DF_SELENIUM_PORT=$DF_SELENIUM_PORT >> .env.ci
    - echo DF_SHIELD_USER=$DF_SHIELD_USER >> .env.ci
    - echo DF_SHIELD_PW=$DF_SHIELD_PW >> .env.ci
    - echo DF_TEST_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r '.[].uri') >> .env.ci
    - echo DF_REF_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.prod --format=json | jq -r '.[].uri') >> .env.ci
    - npx node-env-run --exec 'npm run test:acceptance:css' --env .env.ci --force
  allow_failure: true
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-generated_ref_images"
    expire_in: 1 days
    paths:
      - testing/codeceptjs/output
    when: always

## Standard CSS regression test template.
.css_regression_template:
  stage: validate
  environment:
    action: access
  services:
    -
      name: selenium/standalone-chrome
      alias: selenium
  variables:
    DF_VALIDATE_ARGS: --no-exit
    DOCKER_SHM_SIZE: 2147483648
    START_XVFB: 'false'
    DF_SELENIUM_PORT: 4444
    DF_SELENIUM_HOST: selenium
    NPM_ARGS: ''
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: ""
    DF_REF_HOST: 'http://example.com'
    DF_TEST_HOST: 'http://example.com'
  script:
    - npm install
    - echo DF_SELENIUM=$DF_SELENIUM_HOST >> .env.ci
    - echo DF_SELENIUM_PORT=$DF_SELENIUM_PORT >> .env.ci
    - echo DF_SHIELD_USER=$DF_SHIELD_USER >> .env.ci
    - echo DF_SHIELD_PW=$DF_SHIELD_PW >> .env.ci
    - echo DF_TEST_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.$DRUSH_ALIAS_TYPE --format=json | jq -r '.[].uri') >> .env.ci
    - echo DF_REF_HOST=$(drush sa @$DRUSH_ALIAS_GROUP.prod --format=json | jq -r '.[].uri') >> .env.ci
    - npx node-env-run --exec 'npm run test:acceptance:css' --env .env.ci --force
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-backstop_data"
    paths:
      - testing/codeceptjs/output
    reports:
      junit: testing/codeceptjs/output/result.xml
    when: always

## CSS test exclude rules.
.css_exclude_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$TARGET_PIPELINE != "all" && $TARGET_PIPELINE != "build_and_deploy" && $TARGET_PIPELINE != "validation"'
      when: never
    - if: '$SKIP_VALIDATE == "true"'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip validate\]/'
      when: never

########################################
# Jobs.
########################################

## Feature CSS reference.
reference_feature_css:
  extends:
    - .css_reference_template
    - .feature_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /reference_feature_css/'
      when: never
    - !reference [.css_exclude_rules, rules]
    - !reference [.feature_detect_exclude_rules, rules]
    - !reference [.feature_detect_no_env_exclude_rules, rules]
    - !reference [.feature_detect_include_rules, rules]

## Dev CSS reference.
reference_dev_css:
  extends:
    - .css_reference_template
    - .dev_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /reference_dev_css/'
      when: never
    - !reference [.css_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA CSS reference.
reference_qa_css:
  extends:
    - .css_reference_template
    - .qa_detect_template
  rules:
    - if: '$SKIP_JOBS =~ /reference_qa_css/'
