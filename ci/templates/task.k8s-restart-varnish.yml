########################################
# Kubernetes restart varnish.
########################################


########################################
# Templates.
########################################

## Secrets update template.
## Default template assumes a DigitalOcean k8s cluster.
.task_k8s_kubectl_restart_varnish:
  image:
    name: alpine/doctl:1.28.13
    entrypoint: [""]
  stage: task
  when: manual
  resource_group: deploy
  variables:
    IMAGETAG: ""
    GIT_STRATEGY: none
  environment:
    url: https://$DF_TLD
    action: start
  before_script:
    - mkdir -p ~/.kube
    # doctl authenticating
    - doctl auth init -t ${DIGITALOCEAN_TOKEN}
    # run other doctl command if required
    - apk add jq yq
    # Setup kubeconfig.
    - >
      if [ -z "$K8S_CLUSTER_ID" ]; then
        # Detect the cluster ID, fail if multiple found.
        export K8S_CLUSTER_ID=`$(doctl kubernetes cluster list -o  json |jq -r  .[].id)`;
      fi
    - doctl kubernetes cluster kubeconfig save $K8S_CLUSTER_ID
    - helm version
    - kubectl version
  script:
    # Download deployment secrets if available.
    - kubectl rollout restart deployment $DF_NAMESPACE-$DRUSH_ALIAS_TYPE-$DRUSH_ALIAS_GROUP-httpcache-kube-httpcache

########################################
## Standard task phase stages.
########################################

## Dev secrets.
task_k8s_dev_restart_varnish:
  extends:
    - .dev_detect_template
    - .task_k8s_kubectl_restart_varnish
  rules:
    - if: '$SKIP_JOBS =~ /deploy_dev/'
      when: never
    - !reference [.deploy_drupal_exclude_rules, rules]
    - !reference [.dev_detect_exclude_rules, rules]
    - !reference [.dev_detect_include_rules, rules]

## QA secrets.
task_k8s_qa_restart_varnish:
  extends:
    - .qa_detect_template
    - .task_k8s_kubectl_restart_varnish
  rules:
    - if: '$SKIP_JOBS =~ /deploy_qa/'
      when: never
    - !reference [.deploy_drupal_exclude_rules, rules]
    - !reference [.qa_detect_no_env_exclude_rules, rules]
    - !reference [.qa_detect_include_rules, rules]

## Production secrets.
task_k8s_prod_restart_varnish:
  extends:
    - .prod_detect_template
    - .task_k8s_kubectl_restart_varnish
  rules:
    - if: '$SKIP_JOBS =~ /deploy_prod/'
      when: never
    - if: $CI_DEPLOY_FREEZE != null
      when: never
    - !reference [.deploy_drupal_exclude_rules, rules]
    - !reference [.prod_detect_include_rules, rules]
