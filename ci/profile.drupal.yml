  - local: '/ci/templates/deploy.drupal.yml'
  - local: '/ci/templates/post_security.apply-updates.yml'
  - local: '/ci/templates/post_security.apply-updates.pantheon.yml'
  - local: '/ci/templates/post_update.migrate.yml'
  - local: '/ci/templates/pre_deploy.container.yml'
  - local: '/ci/templates/pre_deploy.package.yml'
  - local: '/ci/templates/pre_deploy.release.yml'
